name: Tests

# Runs on every pull request, and again on main so a merge that goes red is
# visible without waiting for the next deploy.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite runs on Node's own test runner against the TypeScript
      # sources directly, so there is nothing to build first.
      - name: Test
        run: npm run test:coverage
